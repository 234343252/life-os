<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0f7f4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#dceee3;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="treeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#5ea683;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#255843;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- 背景圆 -->
  <circle cx="256" cy="256" r="256" fill="url(#bgGrad)" />
  <!-- 树干 -->
  <rect x="240" y="320" width="32" height="100" rx="6" fill="#3d8966" opacity="0.8" />
  <!-- 树冠 - 三层 -->
  <ellipse cx="256" cy="280" rx="90" ry="70" fill="url(#treeGrad)" opacity="0.95" />
  <ellipse cx="256" cy="210" rx="75" ry="60" fill="url(#treeGrad)" opacity="0.95" />
  <ellipse cx="256" cy="150" rx="55" ry="45" fill="url(#treeGrad)" opacity="0.95" />
  <!-- 树冠高光 -->
  <ellipse cx="235" cy="260" rx="30" ry="20" fill="#8fc4a9" opacity="0.6" />
  <ellipse cx="230" cy="195" rx="22" ry="16" fill="#8fc4a9" opacity="0.5" />
  <ellipse cx="225" cy="140" rx="16" ry="12" fill="#8fc4a9" opacity="0.5" />
  <!-- 人生圆环 - 外圈装饰 -->
  <circle cx="256" cy="256" r="220" fill="none" stroke="#3d8966" stroke-width="2" stroke-dasharray="8 12" opacity="0.3" />
</svg>
